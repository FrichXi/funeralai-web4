name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: pip install -r requirements.txt
      - run: python3 scripts/check_no_secrets.py
      - run: bash -n scripts/*.sh site/prebuild.sh
      - run: pytest tests/ -q
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: CI=true STAGE_TEST=ci npm run build
        working-directory: site
      - run: python3 scripts/release_guard.py verify-local --mode ci
